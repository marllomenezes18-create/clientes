<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amigosaru | Painel Administrativo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #09090b; color: #a1a1aa; }
        .glass { background: rgba(24, 24, 27, 0.9); backdrop-filter: blur(12px); border-bottom: 1px solid #27272a; }
        input, select { background-color: #18181b !important; border: 1px solid #27272a !important; color: white !important; }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="sticky top-0 z-40 glass px-6 py-4">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="h-10 w-10 bg-blue-600 rounded-xl flex items-center justify-center shadow-lg shadow-blue-600/30">
                    <i class="fas fa-bolt text-white"></i>
                </div>
                <h1 class="text-white font-bold tracking-tight text-lg">AMIGOSARU PRO</h1>
            </div>
            <button onclick="toggleModal()" class="bg-blue-600 hover:bg-blue-500 text-white px-5 py-2 rounded-xl text-xs font-bold transition">
                <i class="fas fa-plus mr-2"></i>Novo Cliente
            </button>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-6">
        <!-- Dashboard Rápido -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
            <div class="bg-zinc-900 p-5 rounded-2xl border border-zinc-800">
                <p class="text-[10px] font-bold text-zinc-500 uppercase">Clientes</p>
                <h3 class="text-2xl font-bold text-white" id="count-total">0</h3>
            </div>
            <div class="bg-zinc-900 p-5 rounded-2xl border border-zinc-800">
                <p class="text-[10px] font-bold text-emerald-500 uppercase">Online</p>
                <h3 class="text-2xl font-bold text-white" id="count-online">0</h3>
            </div>
        </div>

        <!-- Tabela de Clientes -->
        <div class="bg-zinc-900 border border-zinc-800 rounded-3xl shadow-2xl overflow-hidden">
            <table class="w-full text-left">
                <thead class="text-[10px] uppercase text-zinc-500 bg-zinc-950/40">
                    <tr>
                        <th class="px-6 py-4">Status</th>
                        <th class="px-6 py-4">Nome / MAC</th>
                        <th class="px-6 py-4">Acesso</th>
                        <th class="px-6 py-4">Servidor</th>
                        <th class="px-6 py-4 text-right">Ação</th>
                    </tr>
                </thead>
                <tbody id="dbRows" class="divide-y divide-zinc-800/50 text-sm">
                    <!-- Dados do Firebase entram aqui -->
                </tbody>
            </table>
        </div>
    </main>

    <!-- Modal de Cadastro -->
    <div id="modalCadastro" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-zinc-900 border border-zinc-800 w-full max-w-md rounded-3xl p-8">
            <h2 class="text-xl font-bold text-white mb-6">Cadastrar Cliente</h2>
            <form id="formCliente" class="space-y-4">
                <input type="text" id="nome" placeholder="Nome do Cliente" required class="w-full rounded-xl p-3 outline-none">
                <input type="text" id="user" placeholder="Usuário" required class="w-full rounded-xl p-3 outline-none">
                <input type="text" id="mac" placeholder="MAC (Opcional)" class="w-full rounded-xl p-3 outline-none">
                <select id="servidor" class="w-full rounded-xl p-3 outline-none">
                    <option value="BRAZIL-01">BRAZIL-01</option>
                    <option value="USA-02">USA-02</option>
                </select>
                <select id="status" class="w-full rounded-xl p-3 outline-none">
                    <option value="online">Online</option>
                    <option value="offline">Offline</option>
                </select>
                <div class="flex gap-2">
                    <button type="button" onclick="toggleModal()" class="flex-1 bg-zinc-800 text-white py-3 rounded-xl font-bold">Cancelar</button>
                    <button type="submit" class="flex-1 bg-blue-600 text-white py-3 rounded-xl font-bold">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Scripts Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCsqUeXLDpUhxvHxXOC19iRoQhPuYOGpFw",
            authDomain: "amigosaru-6a228.firebaseapp.com",
            projectId: "amigosaru-6a228",
            storageBucket: "amigosaru-6a228.firebasestorage.app",
            messagingSenderId: "1024825583351",
            appId: "1:1024825583351:web:4abf29baac04b44e6c55f2"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // FUNÇÃO ADD CLIENTE (CORRIGIDA)
        document.getElementById('formCliente').addEventListener('submit', async (e) => {
            e.preventDefault();
            const novo = {
                nome: document.getElementById('nome').value,
                user: document.getElementById('user').value,
                mac: document.getElementById('mac').value,
                servidor: document.getElementById('servidor').value,
                status: document.getElementById('status').value
            };
            try {
                await addDoc(collection(db, "clientes"), novo);
                document.getElementById('formCliente').reset();
                toggleModal();
            } catch (err) { alert("Erro: " + err.message); }
        });

        // LEITURA REAL-TIME
        onSnapshot(collection(db, "clientes"), (snapshot) => {
            const rows = document.getElementById('dbRows');
            let html = '';
            let total = 0, on = 0;
            snapshot.forEach((snap) => {
                const c = snap.data();
                const id = snap.id;
                total++; if(c.status === 'online') on++;
                html += `
                    <tr>
                        <td class="px-6 py-4"><span class="h-2 w-2 rounded-full inline-block ${c.status === 'online' ? 'bg-emerald-500' : 'bg-rose-500'}"></span></td>
                        <td class="px-6 py-4 text-white font-bold">${c.nome}<br><span class="text-[10px] text-zinc-500 font-mono">${c.mac}</span></td>
                        <td class="px-6 py-4"><button onclick="copy('${c.user}')" class="text-xs bg-zinc-800 px-2 py-1 rounded">Copiar User</button></td>
                        <td class="px-6 py-4 text-blue-400 font-bold text-xs">${c.servidor}</td>
                        <td class="px-6 py-4 text-right">
                            <button onclick="remover('${id}')" class="text-zinc-600 hover:text-rose-500"><i class="fas fa-trash"></i></button>
                        </td>
                    </tr>
                `;
            });
            rows.innerHTML = html;
            document.getElementById('count-total').innerText = total;
            document.getElementById('count-online').innerText = on;
        });

        // FUNÇÕES GLOBAIS
        window.toggleModal = () => document.getElementById('modalCadastro').classList.toggle('hidden');
        window.remover = async (id) => { if(confirm("Remover?")) await deleteDoc(doc(db, "clientes", id)); };
        window.copy = (t) => { navigator.clipboard.writeText(t); alert("Copiado!"); };
    </script>
</body>
</html>
