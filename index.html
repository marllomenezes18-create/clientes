<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amigosaru | Simples</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0c0c0e; font-family: sans-serif; color: #e4e4e7; }
        .search-focus:focus { border-color: #3b82f6; box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2); }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-2xl mx-auto">
        <!-- Barra de Pesquisa -->
        <div class="relative mb-6">
            <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-zinc-500"></i>
            <input type="text" id="filtro" onkeyup="buscar()" 
                placeholder="Pesquisar cliente ou servidor..." 
                class="w-full bg-zinc-900 border border-zinc-800 rounded-xl py-3 pl-12 pr-4 outline-none search-focus transition-all">
        </div>

        <!-- Lista de Clientes -->
        <div class="bg-zinc-900 border border-zinc-800 rounded-2xl overflow-hidden shadow-xl">
            <div id="listaClientes" class="divide-y divide-zinc-800">
                <!-- Os dados aparecem aqui -->
                <div class="p-8 text-center text-zinc-600">Carregando dados do Amigosaru...</div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // Configuração do seu projeto AMIGOSARU
        const firebaseConfig = {
            apiKey: "AIzaSyCsqUeXLDpUhxvHxXOC19iRoQhPuYOGpFw",
            authDomain: "amigosaru-6a228.firebaseapp.com",
            projectId: "amigosaru-6a228",
            storageBucket: "amigosaru-6a228.firebasestorage.app",
            messagingSenderId: "1024825583351",
            appId: "1:1024825583351:web:4abf29baac04b44e6c55f2"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Monitorar banco de dados em tempo real
        onSnapshot(collection(db, "clientes"), (snapshot) => {
            const container = document.getElementById('listaClientes');
            let html = '';

            if (snapshot.empty) {
                container.innerHTML = '<div class="p-8 text-center text-zinc-500">Nenhum cliente encontrado.</div>';
                return;
            }

            snapshot.forEach((doc) => {
                const c = doc.data();
                html += `
                    <div class="p-4 flex justify-between items-center hover:bg-zinc-800/40 transition">
                        <div>
                            <div class="font-bold text-white">${c.nome || 'Sem nome'}</div>
                            <div class="text-xs text-zinc-500">Cliente IPTV</div>
                        </div>
                        <div class="text-right">
                            <span class="text-xs font-bold px-3 py-1 bg-blue-600/10 text-blue-400 border border-blue-600/20 rounded-full">
                                ${c.servidor || 'S/ Servidor'}
                            </span>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        });

        // Função de busca instantânea
        window.buscar = () => {
            const input = document.getElementById('filtro').value.toLowerCase();
            const itens = document.querySelectorAll('#listaClientes > div');
            
            itens.forEach(item => {
                const texto = item.innerText.toLowerCase();
                item.style.display = texto.includes(input) ? 'flex' : 'none';
            });
        };
    </script>
</body>
</html>
