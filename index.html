<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amigosaru | Gestão Simples</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #09090b; font-family: 'Inter', sans-serif; color: #f4f4f5; }
        input { background-color: #18181b !important; border: 1px solid #27272a !important; color: white; }
        .card { background-color: #18181b; border: 1px solid #27272a; }
    </style>
</head>
<body class="p-4 md:p-10">

    <div class="max-w-xl mx-auto">
        
        <!-- Bloco de Cadastro -->
        <div class="card p-6 rounded-2xl mb-8 shadow-xl">
            <h2 class="text-sm font-bold uppercase tracking-widest text-zinc-500 mb-4">Novo Cadastro</h2>
            <div class="flex flex-col gap-3">
                <input type="text" id="nomeCliente" placeholder="Nome do Cliente" class="p-3 rounded-xl outline-none focus:ring-2 focus:ring-blue-600">
                <input type="text" id="nomeServidor" placeholder="Nome do Servidor (Ex: Star, VIP, Gold)" class="p-3 rounded-xl outline-none focus:ring-2 focus:ring-blue-600">
                <button onclick="salvarCliente()" class="bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-xl transition">
                    Salvar no Sistema
                </button>
            </div>
        </div>

        <!-- Barra de Pesquisa -->
        <div class="relative mb-6">
            <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-zinc-500"></i>
            <input type="text" id="busca" onkeyup="filtrar()" placeholder="Buscar por cliente ou servidor..." 
                class="w-full p-3 pl-12 rounded-xl outline-none border border-zinc-800">
        </div>

        <!-- Lista de Resultados -->
        <div id="lista" class="space-y-3">
            <!-- Os dados aparecem aqui -->
        </div>

    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCsqUeXLDpUhxvHxXOC19iRoQhPuYOGpFw",
            authDomain: "amigosaru-6a228.firebaseapp.com",
            projectId: "amigosaru-6a228",
            storageBucket: "amigosaru-6a228.firebasestorage.app",
            messagingSenderId: "1024825583351",
            appId: "1:1024825583351:web:4abf29baac04b44e6c55f2"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // FUNÇÃO PARA SALVAR
        window.salvarCliente = async () => {
            const nome = document.getElementById('nomeCliente').value;
            const servidor = document.getElementById('nomeServidor').value;

            if (!nome || !servidor) {
                alert("Preencha o nome e o servidor!");
                return;
            }

            try {
                await addDoc(collection(db, "clientes"), {
                    nome: nome,
                    servidor: servidor,
                    data: new Date()
                });
                document.getElementById('nomeCliente').value = '';
                document.getElementById('nomeServidor').value = '';
                alert("Cadastrado!");
            } catch (e) { alert("Erro ao salvar"); }
        };

        // FUNÇÃO PARA LER EM TEMPO REAL
        onSnapshot(collection(db, "clientes"), (snapshot) => {
            const container = document.getElementById('lista');
            container.innerHTML = '';
            
            snapshot.forEach((doc) => {
                const item = doc.data();
                container.innerHTML += `
                    <div class="card p-4 rounded-xl flex justify-between items-center animate-fade-in">
                        <span class="font-bold text-white">${item.nome}</span>
                        <span class="text-xs bg-blue-600/20 text-blue-400 px-3 py-1 rounded-full border border-blue-600/30 font-bold uppercase">
                            ${item.servidor}
                        </span>
                    </div>
                `;
            });
        });

        // FUNÇÃO DE BUSCA
        window.filtrar = () => {
            const query = document.getElementById('busca').value.toLowerCase();
            const cards = document.querySelectorAll('#lista > div');
            cards.forEach(card => {
                card.style.display = card.innerText.toLowerCase().includes(query) ? 'flex' : 'none';
            });
        };
    </script>
</body>
</html>
